meda","The Whirlpool"],"answer":0}];
let current=0,filtered=QUESTIONS,answered=false,audioPlayer=null;
const $=id=>document.getElementById(id), category=$('category'), difficulty=$('difficulty');
[...new Set(QUESTIONS.map(q=>q.category))].forEach(v=>category.insertAdjacentHTML('beforeend',`<option>${v}</option>`));
[...new Set(QUESTIONS.map(q=>q.difficulty))].sort((a,b)=>a-b).forEach(v=>difficulty.insertAdjacentHTML('beforeend',`<option value="${v}">Level ${v}</option>`));
function filteredQuestions(){const text=$('search').value.toLowerCase();return QUESTIONS.filter(q=>(category.value==='all'||q.category===category.value)&&(difficulty.value==='all'||q.difficulty==difficulty.value)&&(!text||q.question.toLowerCase().includes(text)||q.choices.some(c=>c.toLowerCase().includes(text))));}
function renderList(){filtered=filteredQuestions();$('count').textContent=filtered.length;$('questionList').innerHTML=filtered.map((q,i)=>`<div class="row"><small>${q.category} · Level ${q.difficulty}</small><span>${q.question}</span><button class="speak" data-index="${i}">🔊</button></div>`).join('')||'<div class="load">No matching questions.</div>';document.querySelectorAll('.speak').forEach(b=>b.onclick=()=>speak(filtered[+b.dataset.index]));}
function show(){if(!filtered.length)return;$('meta').textContent=`${filtered[current].category} · Level ${filtered[current].difficulty} · ${current+1}/${filtered.length}`;$('question').textContent=filtered[current].question;$('status').textContent='';$('status').className='status';answered=false;$('choices').innerHTML=filtered[current].choices.map((c,i)=>`<button class="choice" data-i="${i}">${String.fromCharCode(65+i)} · ${c}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i));}
function answer(i){if(answered)return;answered=true;const q=filtered[current];document.querySelectorAll('.choice').forEach((b,n)=>{if(n===q.answer)b.classList.add('correct');if(n===i&&i!==q.answer)b.classList.add('wrong');});$('status').textContent=i===q.answer?'Correct! 🎉':`Not quite — the answer is ${q.choices[q.answer]}.`;$('status').className='status '+(i===q.answer?'good':'bad');}
function speak(question){if(audioPlayer){audioPlayer.pause();audioPlayer.currentTime=0}audioPlayer=new Audio(`audio/${question.id}.mp3`);$('loadStatus').textContent='Playing voice track…';audioPlayer.onended=()=>$('loadStatus').textContent='Voice tracks are ready — no special browser features or model download needed.';audioPlayer.onerror=()=>{$('loadStatus').textContent='Audio could not be loaded. Make sure the audio folder was uploaded too.'};audioPlayer.play().catch(()=>{$('loadStatus').textContent='Press Speak again to start audio.'})}

$('speak').onclick=()=>filtered[current]&&speak(filtered[current]);$('next').onclick=()=>{if(filtered.length){current=(current+1)%filtered.length;show()}};$('random').onclick=()=>{if(filtered.length){current=Math.floor(Math.random()*filtered.length);show()}};[category,difficulty,$('search')].forEach(el=>el.oninput=()=>{renderList();current=0;show()});
renderList();show();
</script>
