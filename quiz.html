<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ</title>
    <link rel="preload" href="audio/correct.mp3" as="audio" type="audio/mpeg">
    <link rel="preload" href="audio/wrong.mp3" as="audio" type="audio/mpeg">
    <style>
        :root {
            --ink: #17233d;
            --navy: #18274b;
            --paper: #fffdf7;
            --cream: #f7ebc9;
            --yellow: #ffd84d;
            --blue: #54c7ec;
            --green: #45b969;
            --red: #e95c55;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 18%, rgba(255,216,77,.45) 0 7%, transparent 7.2%),
                radial-gradient(circle at 91% 84%, rgba(84,199,236,.35) 0 9%, transparent 9.2%),
                var(--cream);
            color: var(--ink);
            font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px clamp(20px, 3vw, 48px);
            background: var(--navy);
            color: white;
            border-bottom: 7px solid var(--yellow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            box-shadow: 0 6px 0 rgba(23,35,61,.12);
            flex-shrink: 0;
        }
        h1 {
            margin: 0;
            font-size: clamp(30px, 3vw, 46px);
            line-height: 1;
            letter-spacing: .08em;
            text-transform: uppercase;
            transform: rotate(-2deg);
        }
        h1::before { content: "★"; color: var(--yellow); margin-right: 12px; }
        .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
        .controls label {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #b8c6e5;
            margin-left: 5px;
        }
        .score {
            display: flex;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
            margin-right: 8px;
        }
        .score .right, .score .wrong {
            padding: 9px 13px;
            border-radius: 999px;
            color: white;
        }
        .score .right { background: var(--green); }
        .score .wrong { background: var(--red); }
        .done-button {
            padding: 10px 18px;
            background: var(--yellow);
            color: var(--ink);
            font-weight: bold;
            box-shadow: 0 4px 0 #b78600;
        }
        .done-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b78600; }
        select, button {
            font: inherit;
            border: 0;
            border-radius: 12px;
            padding: 11px 15px;
            background: white;
            color: var(--ink);
            cursor: pointer;
        }
        select { font-weight: bold; box-shadow: inset 0 0 0 2px #ccd4e5; }
        .filter-button {
            min-width: 112px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            font-weight: bold;
            box-shadow: inset 0 0 0 2px #ccd4e5;
        }
        .filter-button::after { content: "▾"; color: #69748c; }
        select:focus, button:focus {
            outline: 5px solid var(--blue);
            outline-offset: 4px;
        }
        main {
            position: relative;
            width: min(1280px, calc(100% - 48px));
            margin: auto;
            flex-shrink: 0;
            padding: clamp(28px, 4vw, 52px);
            text-align: center;
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 12px 12px 0 var(--ink);
        }
        main:focus { outline: none; }
        .meta {
            position: absolute;
            top: 20px;
            left: 28px;
            color: #7b8499;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .status {
            position: absolute;
            top: 16px;
            right: 26px;
            padding: 8px 16px;
            border-radius: 999px;
            background: var(--yellow);
            color: var(--ink);
            font-size: 18px;
            font-weight: bold;
        }
        .status:empty { display: none; }
        .question {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(36px, 5vw, 76px);
            line-height: 1.08;
            font-weight: bold;
            margin: 0 auto clamp(30px, 5vh, 52px);
            max-width: 950px;
            text-wrap: balance;
        }
        .choices {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 930px;
            margin: 0 auto;
        }
        .choices.two-options {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            max-width: 630px;
        }
        .choice {
            position: relative;
            min-height: 104px;
            padding: 18px 20px;
            font-size: clamp(22px, 2.5vw, 34px);
            font-weight: bold;
            border: 3px solid var(--ink);
            border-radius: 18px;
            background: white;
            box-shadow: 0 7px 0 var(--ink);
            transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
        }
        .choice::before {
            content: attr(data-letter);
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            margin-right: 10px;
            border-radius: 50%;
            background: var(--yellow);
            color: var(--ink);
            font-size: 20px;
            vertical-align: middle;
        }
        .choice.correct::before { content: "✓"; background: var(--green); color: white; }
        .choice.wrong::before { content: "✕"; background: var(--red); color: white; }
        .choice:hover { background: #fff7ce; transform: translateY(-3px); box-shadow: 0 10px 0 var(--ink); }
        .choice.remote-focus {
            outline: none;
            border-color: #087f9c;
            box-shadow: 0 0 0 4px var(--blue), 0 7px 0 #087f9c;
            transform: translateY(-2px);
        }
        .choice:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
        .choice.correct {
            background: #bcebc7;
            border-color: #23783b;
            box-shadow: 0 7px 0 #23783b;
            color: #124b25;
            animation: pop .35s ease-out;
        }
        .choice.wrong {
            background: #ffd4d1;
            border-color: #a93232;
            box-shadow: 0 7px 0 #a93232;
            color: #761f1f;
            animation: shake .3s ease-out;
        }
        .hint {
            margin-top: clamp(34px, 5vh, 52px);
            font-size: clamp(15px, 1.5vw, 19px);
            font-weight: bold;
            letter-spacing: .06em;
            color: #6c7690;
        }
        .tv-hint { display: none; }
        .tv-mode .desktop-hint { display: none; }
        .tv-mode .tv-hint { display: inline; }
        .nav-buttons { margin-top: 20px; display: flex; justify-content: center; gap: 14px; }
        .nav-buttons button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-width: 150px;
            padding: 12px 22px;
            background: var(--navy);
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 0 #081228;
        }
        .nav-buttons button:active { transform: translateY(4px); box-shadow: 0 1px 0 #081228; }
        .results, .child-results {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            padding: 28px;
            background: rgba(8, 18, 40, .82);
        }
        .results[hidden], .child-results[hidden] { display: none; }
        .start-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: grid;
            place-items: center;
            padding: 28px;
            background: var(--navy);
        }
        .start-screen[hidden] { display: none; }
        .start-card {
            width: min(620px, 100%);
            padding: clamp(36px, 6vw, 70px);
            color: white;
            text-align: center;
        }
        .start-logo { color: var(--yellow); font-size: clamp(70px, 10vw, 120px); line-height: .8; }
        .start-card h2 {
            margin: 28px 0 12px;
            font-size: clamp(48px, 7vw, 82px);
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .start-card p { margin: 0 0 34px; color: #cbd5ef; font-size: clamp(18px, 2.5vw, 26px); }
        .start-button {
            min-width: 220px;
            padding: 16px 34px;
            background: var(--yellow);
            color: var(--ink);
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 6px 0 #b78600;
        }
        .start-button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b78600; }
        .child-results { z-index: 90; }
        .child-results-card {
            width: min(720px, 100%);
            padding: clamp(34px, 5vw, 64px);
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 12px 12px 0 var(--yellow);
            text-align: center;
        }
        .child-kicker {
            color: #6c7690;
            font-weight: bold;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .child-results-card h2 {
            margin: 12px 0 20px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 6vw, 68px);
        }
        .child-score { font-size: clamp(28px, 4vw, 44px); font-weight: bold; }
        .child-score strong { font-size: 1.5em; }
        .child-progress { margin: 14px 0 30px; color: #667087; font-size: 20px; font-weight: bold; }
        .child-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
        .child-actions button {
            padding: 14px 24px;
            background: var(--navy);
            color: white;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 0 #081228;
        }
        .child-actions .secondary { background: white; color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
        .results-card {
            width: min(1000px, 100%);
            max-height: calc(100vh - 56px);
            overflow: auto;
            padding: clamp(28px, 4vw, 52px);
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 12px 12px 0 var(--yellow);
            text-align: center;
        }
        .results-card h2 {
            margin: 0 0 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 5vw, 68px);
        }
        .results-summary {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 24px 0 34px;
        }
        .result-number {
            min-width: 150px;
            padding: 15px 20px;
            border-radius: 18px;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .result-number strong { display: block; font-size: 38px; }
        .result-number.right { background: var(--green); }
        .result-number.wrong { background: var(--red); }
        .result-number.total { background: var(--navy); }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; text-align: left; }
        .chart h3 { margin: 0 0 16px; font-size: 24px; }
        .chart-row {
            display: grid;
            grid-template-columns: 90px 1fr;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }
        .chart-label { font-weight: bold; }
        .bar {
            position: relative;
            display: flex;
            height: 30px;
            overflow: hidden;
            background: #e5e8ef;
            border: 2px solid var(--ink);
            border-radius: 999px;
        }
        .bar-right { background: var(--green); }
        .bar-wrong { background: var(--red); }
        .bar-count {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 1px white;
        }
        .results-actions { margin-top: 34px; }
        .results-actions button {
            padding: 14px 28px;
            background: var(--navy);
            color: white;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 0 #081228;
        }
        .parent-observability {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 34px;
            margin-top: 34px;
            text-align: left;
        }
        .parent-section { text-align: left; }
        .parent-section h3 { margin: 0 0 14px; font-size: 24px; }
        .session-data { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .session-stat { padding: 12px; border-radius: 12px; background: #edf1f7; }
        .session-stat strong { display: block; font-size: 23px; }
        .batch-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #d5dae5; }
        .review-section { margin-top: 34px; }
        .review-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 18px;
            padding: 12px 0;
            border-bottom: 1px solid #d5dae5;
        }
        .review-item strong { font-size: 17px; }
        .review-answer { color: #6a7388; }
        .review-time { grid-row: 1 / 3; grid-column: 2; align-self: center; color: #6a7388; white-space: nowrap; }
        .picker {
            position: fixed;
            inset: 0;
            z-index: 120;
            display: grid;
            place-items: center;
            padding: 28px;
            background: rgba(8, 18, 40, .86);
        }
        .picker[hidden] { display: none; }
        .picker-card {
            width: min(720px, 100%);
            padding: clamp(28px, 4vw, 48px);
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 12px 12px 0 var(--yellow);
            text-align: center;
        }
        .picker-card h2 {
            margin: 0 0 28px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 4vw, 52px);
        }
        .picker-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .picker-option {
            min-height: 72px;
            border: 3px solid var(--ink);
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 6px 0 var(--ink);
        }
        .picker-option.selected { background: var(--yellow); }
        .picker-cancel {
            margin-top: 26px;
            background: var(--navy);
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        .tv-mode select:focus, .tv-mode button:focus { outline: 4px solid var(--blue); outline-offset: 3px; }
        .tv-mode .choice:focus { outline: none; }
        .tv-mode .nav-buttons button:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 0 0 4px var(--blue), 0 5px 0 #081228;
        }
        .tv-mode .child-actions button:focus {
            outline: none;
            transform: translateY(-2px);
        }
        .tv-mode .child-actions button:not(.secondary):focus {
            box-shadow: 0 0 0 4px var(--blue), 0 5px 0 #081228;
        }
        .tv-mode .child-actions .secondary:focus {
            box-shadow: inset 0 0 0 3px var(--ink), 0 0 0 4px var(--blue);
        }
        .tv-mode header { padding: 9px 18px; gap: 10px; }
        .tv-mode h1 { flex: 0 0 auto; font-size: 30px; }
        .tv-mode .controls { flex-wrap: nowrap; gap: 7px; }
        .tv-mode .filter-button { min-width: 104px; font-size: 15px; padding: 8px 10px; }
        .tv-mode .controls label { display: none; }
        .tv-mode .score { margin-right: 1px; font-size: 15px; }
        .tv-mode .score .right, .tv-mode .score .wrong { padding: 6px 9px; }
        .tv-mode .done-button { padding: 7px 12px; }
        .tv-mode main { width: min(1000px, 84vw); padding: 32px; }
        .tv-mode .question { max-width: 820px; font-size: clamp(34px, 4vw, 54px); }
        .tv-mode .choice { min-height: 74px; font-size: clamp(20px, 2.1vw, 27px); }
        .tv-mode .hint { font-size: 14px; }
        .tv-mode .meta { font-size: 12px; }
        .tv-mode .status { font-size: 16px; }
        .tv-mode .nav-buttons button { min-width: 125px; padding: 10px 16px; font-size: 16px; }
        .tv-mode .results-card { width: min(900px, 84vw); max-height: 84vh; padding: 24px; }
        .tv-mode .results-card h2 { font-size: 48px; }
        .tv-mode .results-summary { margin: 16px 0 24px; }
        .tv-mode .result-number { min-width: 125px; padding: 10px 16px; font-size: 18px; }
        .tv-mode .result-number strong { font-size: 30px; }
        .tv-mode .chart-row { margin: 8px 0; }
        .tv-mode .chart-label, .tv-mode .bar-count { font-size: 14px; }
        .tv-mode .bar { height: 28px; }
        .tv-mode .child-results-card { width: min(620px, 80vw); padding: 34px; }
        .tv-mode .picker-card { width: min(600px, 80vw); padding: 32px; }
        @keyframes pop { 50% { transform: scale(1.08) rotate(-1deg); } }
        @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @media (max-width: 800px) {
            header { align-items: flex-start; flex-direction: column; }
            .controls {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr);
                justify-content: stretch;
                width: 100%;
            }
            .controls .score { grid-column: 1 / -1; }
            .controls .done-button { grid-column: 1 / -1; width: 100%; }
            .controls label { margin-left: 0; }
            .controls .filter-button { width: 100%; }
            main { width: calc(100% - 28px); padding: 80px 18px 28px; box-shadow: 7px 7px 0 var(--ink); }
            .meta { top: 18px; left: 20px; max-width: calc(100% - 40px); font-size: 12px; }
            .status { top: 42px; right: 18px; padding: 6px 11px; font-size: 14px; }
            .choices, .choices.two-options { grid-template-columns: 1fr; max-width: 930px; }
            .choice { min-height: 70px; }
            .nav-buttons { gap: 8px; }
            .nav-buttons button { flex: 1; min-width: 0; padding-inline: 8px; font-size: 16px; }
            .charts { grid-template-columns: 1fr; }
            .parent-observability { grid-template-columns: 1fr; }
            .results, .child-results { padding: 14px; }
            .results-card { max-height: calc(100vh - 28px); padding: 28px 18px; }
            .child-results-card { padding: 34px 20px; }
            .session-data { grid-template-columns: 1fr; }
            .picker-options { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header>
        <h1>QUIZ</h1>
        <div class="controls">
            <div class="score" id="score"><span class="right">✓ Right: 0</span><span class="wrong">✕ Wrong: 0</span></div>
            <button class="done-button" id="done">Done</button>
            <label for="category-button">Category</label>
            <select id="category" hidden>
                <option value="random">Random</option>
                <option value="Math">Math</option>
                <option value="Spelling">Spelling</option>
                <option value="Space">Space</option>
            </select>
            <button class="filter-button" id="category-button" type="button" aria-haspopup="dialog">Random</button>
            <label for="difficulty-button">Difficulty</label>
            <select id="difficulty" hidden>
                <option value="random">Random</option>
                <option value="1">1 - Easy</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5 - Tricky</option>
            </select>
            <button class="filter-button" id="difficulty-button" type="button" aria-haspopup="dialog">Random</button>
        </div>
    </header>

    <div class="start-screen" id="start-screen" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <section class="start-card">
            <div class="start-logo" aria-hidden="true">★</div>
            <h2 id="start-title">Quiz</h2>
            <p>Ready to play?</p>
            <button class="start-button" id="start-button" type="button">Start</button>
        </section>
    </div>

    <main id="game" tabindex="-1">
        <div class="meta" id="meta"></div>
        <div class="status" id="status" aria-live="polite"></div>
        <div class="question" id="question"></div>
        <div class="choices" id="choices"></div>
        <div class="hint">
            <span class="desktop-hint">SPACE = SHOW ANSWER · AUTO-NEXT IN 5S · S = HEAR · ← → = MOVE</span>
            <span class="tv-hint">SELECT AN ANSWER · AUTO-NEXT IN 5S · HEAR REPLAYS THE QUESTION</span>
        </div>
        <div class="nav-buttons">
            <button id="previous">← Previous</button>
            <button id="hear">Hear</button>
            <button id="next">Next →</button>
        </div>
    </main>

    <div class="child-results" id="child-results" role="dialog" aria-modal="true" aria-labelledby="child-results-title" hidden>
        <section class="child-results-card" id="child-results-card" tabindex="-1">
            <div class="child-kicker" id="child-kicker"></div>
            <h2 id="child-results-title"></h2>
            <div class="child-score" id="child-score"></div>
            <p class="child-progress" id="child-progress"></p>
            <div class="child-actions">
                <button id="continue-playing">Continue</button>
                <button class="secondary" id="parent-details">Parent details</button>
            </div>
        </section>
    </div>

    <div class="results" id="results" role="dialog" aria-modal="true" aria-labelledby="results-title" hidden>
        <section class="results-card" id="results-card" tabindex="-1">
            <h2 id="results-title">Parent details</h2>
            <div class="results-summary" id="results-summary"></div>
            <div class="charts">
                <div class="chart">
                    <h3>By category</h3>
                    <div id="category-chart"></div>
                </div>
                <div class="chart">
                    <h3>By difficulty</h3>
                    <div id="difficulty-chart"></div>
                </div>
            </div>
            <div class="parent-observability">
                <div class="parent-section">
                    <h3>By batch</h3>
                    <div id="batch-chart"></div>
                </div>
                <div class="parent-section">
                    <h3>Session</h3>
                    <div class="session-data" id="session-data"></div>
                </div>
            </div>
            <div class="parent-section review-section">
                <h3>Questions to review</h3>
                <div class="review-list" id="review-list"></div>
            </div>
            <div class="results-actions">
                <button id="back-to-summary">Back</button>
            </div>

    <script>
        const userAgent = navigator.userAgent;
        const tvUserAgent = /Android TV|GoogleTV|SmartTV|HbbTV|BRAVIA|Tizen|webOS|NetCast|BrowseHere|TCL/i.test(userAgent)
            || (/Android/i.test(userAgent) && !/Mobile/i.test(userAgent));
        const wideLandscapeScreen = window.innerWidth >= 800 && window.innerWidth / window.innerHeight >= 1.4;
        const isTv = tvUserAgent || wideLandscapeScreen;
        if (isTv) document.body.classList.add('tv-mode');

        const QUESTIONS = JSON.parse(document.getElementById('question-bank').textContent);
        const BATCH_SIZE = 25;
        const PROGRESS_STORAGE_KEY = 'quiz-progress-v1';

        let deck = [];
        let position = -1;
        let answered = false;
        let started = false;
        let rightAnswers = 0;
        let wrongAnswers = 0;
        let revealedAnswers = 0;
        let advanceInterval = null;
        let speakTimeout = null;
        let questionAudio = null;
        let feedbackAudio = null;
        let questionShownAt = performance.now();
        let pendingBatchReport = false;
        let childContinueShouldAdvance = false;
        let remoteChoicePosition = 0;
        let remoteArea = 'choices';
        let remoteHeaderPosition = 0;
        let storedRecords = loadStoredRecords();
        const sessionStartedAt = Date.now();
        const sessionLog = [];
        const answers = new Map();
        const choiceOrders = new Map();
        const categoryStats = {
            Math: {right: 0, wrong: 0},
            Spelling: {right: 0, wrong: 0},
            Space: {right: 0, wrong: 0}
        };
        const difficultyStats = Object.fromEntries(
            [1, 2, 3, 4, 5].map(level => [level, {right: 0, wrong: 0}])
        );

        const category = document.getElementById('category');
        const difficulty = document.getElementById('difficulty');
        const categoryButton = document.getElementById('category-button');
        const difficultyButton = document.getElementById('difficulty-button');
        const question = document.getElementById('question');
        const choices = document.getElementById('choices');
        const meta = document.getElementById('meta');
        const status = document.getElementById('status');
        const score = document.getElementById('score');
        const results = document.getElementById('results');
        const childResults = document.getElementById('child-results');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        const nextButton = document.getElementById('next');
        const doneButton = document.getElementById('done');
        const picker = document.getElementById('picker');
        const pickerTitle = document.getElementById('picker-title');
        const pickerOptions = document.getElementById('picker-options');
        const hint = document.querySelector('.hint');
        let activePicker = null;

        const pickerData = {
            category: {
                title: 'Choose a category',
                select: category,
                trigger: categoryButton,
                options: [['random', 'Random'], ['Math', 'Math'], ['Spelling', 'Spelling'], ['Space', 'Space']]
            },
            difficulty: {
                title: 'Choose a level',
                select: difficulty,
                trigger: difficultyButton,
                options: [['random', 'Random'], ['1', 'Level 1 · Easy'], ['2', 'Level 2'], ['3', 'Level 3'], ['4', 'Level 4'], ['5', 'Level 5 · Tricky']]
            }
        };
        if (isTv) {
            categoryButton.textContent = 'Category: Random';
            difficultyButton.textContent = 'Level: Random';
        }

        function updateScore() {
            score.innerHTML = isTv
                ? `<span class="right">✓ ${rightAnswers}</span><span class="wrong">✕ ${wrongAnswers}</span>`
                : `<span class="right">✓ Right: ${rightAnswers}</span><span class="wrong">✕ Wrong: ${wrongAnswers}</span>`;
        }

        function openPicker(type) {
            const data = pickerData[type];
            activePicker = type;
            pickerTitle.textContent = data.title;
            pickerOptions.innerHTML = '';
            data.options.forEach(([value, label]) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'picker-option';
                button.textContent = label;
                if (data.select.value === value) button.classList.add('selected');
                button.addEventListener('click', () => choosePickerValue(value, label));
                pickerOptions.appendChild(button);
            });
            data.trigger.setAttribute('aria-expanded', 'true');
            picker.hidden = false;
            const selected = pickerOptions.querySelector('.selected') || pickerOptions.firstElementChild;
            selected.focus();
        }

        function moveModal(step) {
            const buttons = !childResults.hidden
                ? [...childResults.querySelectorAll('button')]
                : [...results.querySelectorAll('button')];
            if (!buttons.length) return;
            const current = buttons.indexOf(document.activeElement);
            buttons[(current < 0 ? 0 : current + step + buttons.length) % buttons.length].focus();
        }

        const headerControls = () => [doneButton, categoryButton, difficultyButton];
        const navControls = () => [
            document.getElementById('previous'),
            document.getElementById('hear'),
            nextButton
        ];

        function moveHeader(step) {
            const controls = headerControls();
            remoteHeaderPosition = (remoteHeaderPosition + step + controls.length) % controls.length;
            remoteArea = 'header';
            controls[remoteHeaderPosition].focus();
        }

        function focusHeader() {
            const controls = headerControls();
            remoteArea = 'header';
            remoteHeaderPosition = 1;
            controls[remoteHeaderPosition].focus();
        }

        function focusChoice(index = remoteChoicePosition) {
            if (!choices.children.length) return;
            remoteArea = 'choices';
            remoteChoicePosition = Math.max(0, Math.min(index, choices.children.length - 1));
            updateRemoteChoiceFocus();
            choices.children[remoteChoicePosition].focus();
        }

        function moveNav(step) {
            const controls = navControls();
            const current = Math.max(0, controls.indexOf(document.activeElement));
            const next = (current + step + controls.length) % controls.length;
            remoteArea = 'nav';
            controls[next].focus();
        }

        function focusNav(index = remoteChoicePosition) {
            const controls = navControls();
            const next = Math.max(0, Math.min(index, controls.length - 1));
            remoteArea = 'nav';
            controls[next].focus();
        }

        function movePicker(step) {
            const pickerButtons = [...picker.querySelectorAll('.picker-option, .picker-cancel')];
            const current = pickerButtons.indexOf(document.activeElement);
            if (!pickerButtons.length) return;
            pickerButtons[(current + step + pickerButtons.length) % pickerButtons.length].focus();
        }

        function choosePickerValue(value, label) {
            const data = pickerData[activePicker];
            data.select.value = value;
            const prefix = activePicker === 'category' ? 'Category' : 'Level';
            data.trigger.textContent = isTv ? `${prefix}: ${label}` : label;
            closePicker(false);
            data.select.dispatchEvent(new Event('change'));
            data.trigger.focus();
        }

        function closePicker(restoreFocus = true) {
            if (!activePicker) return;
            const trigger = pickerData[activePicker].trigger;
            trigger.setAttribute('aria-expanded', 'false');
            picker.hidden = true;
            activePicker = null;
            if (restoreFocus) trigger.focus();
        }

        function shuffle(items) {
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            return items;
        }

        function matchingQuestions() {
            return QUESTIONS.filter(item =>
                (category.value === 'random' || item.category === category.value) &&
                (difficulty.value === 'random' || item.difficulty === Number(difficulty.value))
            );
        }

        function buildDeck(items) {
            if (difficulty.value !== 'random') return shuffle([...items]);

            const categories = ['Math', 'Spelling', 'Space'];
            const byLevel = Object.fromEntries([1, 2, 3, 4, 5].map(level => {
                const pools = Object.fromEntries(categories.map(name => [
                    name,
                    shuffle(items.filter(item => item.difficulty === level && item.category === name))
                ]));
                const levelQuestions = [];
                let turn = 0;
                while (Object.values(pools).some(pool => pool.length)) {
                    const preferred = categories[(turn + level - 1) % categories.length];
                    const pool = pools[preferred].length
                        ? pools[preferred]
                        : Object.values(pools).find(candidate => candidate.length);
                    levelQuestions.push(pool.pop());
                    turn++;
                }
                return [level, levelQuestions];
            }));
            const orders = [[1, 3, 2, 4, 5], [2, 4, 1, 5, 3], [1, 2, 4, 3, 5]];
            const ordered = [];
            let round = 0;
            while (Object.values(byLevel).some(group => group.length)) {
                orders[round % orders.length].forEach(level => {
                    if (byLevel[level].length) ordered.push(byLevel[level].pop());
                });
                round++;
            }
            return ordered;
        }

        function rebuildDeck() {
            const available = matchingQuestions().filter(item => !answers.has(item.id));
            deck = buildDeck(available);
            position = 0;
            if (!deck.length) {
                showChildResults(false);
                return;
            }
            showQuestion();
            if (isTv) document.getElementById('game').focus();
        }

        function currentItem() {
            return deck[position];
        }

        function clearAdvanceTimer() {
            if (advanceInterval) clearInterval(advanceInterval);
            advanceInterval = null;
            nextButton.textContent = 'Next →';
        }

        function startAdvanceTimer() {
            clearAdvanceTimer();
            let seconds = 5;
            const label = pendingBatchReport ? 'Results' : 'Next';
            nextButton.textContent = `${label} → ${seconds}`;
            hint.textContent = `Hear replays the question · ${label} question in ${seconds} seconds`;
            advanceInterval = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearAdvanceTimer();
                    move(1);
                } else {
                    nextButton.textContent = `${label} → ${seconds}`;
                    hint.textContent = `Hear replays the question · ${label} question in ${seconds} seconds`;
                }
            }, 1000);
        }

        function paintAnswer(item, selectedIndex) {
            [...choices.children].forEach(button => {
                const choiceIndex = Number(button.dataset.choiceIndex);
                if (choiceIndex === item.answer) button.classList.add('correct');
                if (selectedIndex !== null && choiceIndex === selectedIndex && choiceIndex !== item.answer) {
                    button.classList.add('wrong');
                }
            });
            status.textContent = selectedIndex === null
                ? `The answer is ${item.choices[item.answer]}`
                : selectedIndex === item.answer
                    ? 'Correct! 🎉'
                    : `Not quite — the answer is ${item.choices[item.answer]}`;
            hint.textContent = 'Hear replays the question · Next question in 5 seconds';
        }

        function updateRemoteChoiceFocus() {
            [...choices.children].forEach((button, index) => {
                button.classList.toggle('remote-focus', index === remoteChoicePosition && !answered);
            });
        }

        function remoteChoiceStep(step) {
            if (answered || !choices.children.length) return;
            remoteChoicePosition = (remoteChoicePosition + step + choices.children.length) % choices.children.length;
            focusChoice(remoteChoicePosition);
        }

        function remoteSelect() {
            if (!childResults.hidden || !results.hidden || !picker.hidden) return;
            const button = choices.children[remoteChoicePosition];
            if (button) chooseAnswer(Number(button.dataset.choiceIndex));
        }

        function showQuestion() {
            clearAdvanceTimer();
            if (speakTimeout) clearTimeout(speakTimeout);
            stopQuestionAudio();
            stopFeedbackAudio();
            const item = currentItem();
            if (!item) return;
            const savedAnswer = answers.get(item.id);
            answered = answers.has(item.id);
            const batch = savedAnswer ? savedAnswer.batch : Math.floor(position / BATCH_SIZE) + 1;
            const batchQuestion = savedAnswer ? savedAnswer.batchQuestion : (position % BATCH_SIZE) + 1;
            question.textContent = item.question;
            meta.textContent = `${batchQuestion} / ${BATCH_SIZE}`;
            status.textContent = '';
            hint.textContent = 'Choose an answer';
            choices.innerHTML = '';
            choices.classList.toggle('two-options', item.choices.length === 2);
            remoteChoicePosition = 0;
            if (!choiceOrders.has(item.id)) {
                choiceOrders.set(item.id, shuffle(item.choices.map((_, index) => index)));
            }
            choiceOrders.get(item.id).forEach((choiceIndex, displayIndex) => {
                const button = document.createElement('button');
                button.className = 'choice';
                button.tabIndex = 0;
                button.dataset.letter = String.fromCharCode(65 + displayIndex);
                button.dataset.choiceIndex = choiceIndex;
                button.textContent = item.choices[choiceIndex];
                button.addEventListener('click', () => chooseAnswer(choiceIndex));
                choices.appendChild(button);
            });
            updateRemoteChoiceFocus();
            if (savedAnswer) paintAnswer(item, savedAnswer.selectedIndex);
            if (started && remoteArea !== 'header') focusChoice(0);
            questionShownAt = performance.now();
            if (started) speakTimeout = setTimeout(speakQuestion, 350);
        }

        function startGame() {
            started = true;
            startScreen.hidden = true;
            focusChoice(0);
            speakQuestion();
        }

        function recordResponse(item, selectedIndex) {
            const sequence = sessionLog.length + 1;
            const record = {
                sequence,
                batch: Math.ceil(sequence / BATCH_SIZE),
                batchQuestion: ((sequence - 1) % BATCH_SIZE) + 1,
                id: item.id,
                category: item.category,
                difficulty: item.difficulty,
                question: item.question,
                playedAt: Date.now(),
                selectedIndex,
                selectedAnswer: selectedIndex === null ? null : item.choices[selectedIndex],
                correctAnswer: item.choices[item.answer],
                correct: selectedIndex === null ? null : selectedIndex === item.answer,
                responseSeconds: Math.max(0.1, (performance.now() - questionShownAt) / 1000)
            };
            sessionLog.push(record);
            persistRecord(record);
            answers.set(item.id, record);

            if (record.correct === true) {
                rightAnswers++;
                categoryStats[item.category].right++;
                difficultyStats[item.difficulty].right++;
            } else if (record.correct === false) {
                wrongAnswers++;
                categoryStats[item.category].wrong++;
                difficultyStats[item.difficulty].wrong++;
            } else {
                revealedAnswers++;
            }
            updateScore();
            pendingBatchReport = sequence % BATCH_SIZE === 0;
            return record;
        }

        function revealAnswer() {
            if (answered) return;
            answered = true;
            const item = currentItem();
            recordResponse(item, null);
            paintAnswer(item, null);
            startAdvanceTimer();
        }

        function chooseAnswer(index) {
            if (answered) return;
            answered = true;
            const item = currentItem();
            const record = recordResponse(item, index);
            paintAnswer(item, index);
            playTone(record.correct);
            startAdvanceTimer();
        }

        function playTone(correct) {
            stopQuestionAudio();
            stopFeedbackAudio();
            feedbackAudio = new Audio(correct ? 'audio/correct.mp3' : 'audio/wrong.mp3');
            feedbackAudio.preload = 'auto';
            feedbackAudio.volume = 1;
            feedbackAudio.play().catch(() => {});
        }

        function loadStoredRecords() {
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY) || '[]');
                return Array.isArray(saved) ? saved : [];
            } catch (error) {
                return [];
            }
        }

        function persistRecord(record) {
            storedRecords.push(record);
            localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(storedRecords));
        }

        function recordsForToday() {
            const today = new Date().toDateString();
            return storedRecords.filter(record => new Date(record.playedAt).toDateString() === today);
        }

        function aggregateStats(records) {
            const category = {
                Math: {right: 0, wrong: 0},
                Spelling: {right: 0, wrong: 0},
                Space: {right: 0, wrong: 0}
            };
            const difficulty = Object.fromEntries(
                [1, 2, 3, 4, 5].map(level => [level, {right: 0, wrong: 0}])
            );
            records.forEach(record => {
                const target = record.correct ? 'right' : record.correct === false ? 'wrong' : null;
                if (target) {
                    category[record.category][target]++;
                    difficulty[record.difficulty][target]++;
                }
            });
            return {category, difficulty};
        }

        function scrollResults(step) {
            const card = document.getElementById('results-card');
            card.scrollBy({top: step * Math.max(220, card.clientHeight * 0.7), behavior: 'auto'});
        }

        function chartRows(items) {
            return items.map(([label, values]) => {
                const total = values.right + values.wrong;
                const rightWidth = total ? (values.right / total) * 100 : 0;
                const wrongWidth = total ? (values.wrong / total) * 100 : 0;
                const count = total ? `${values.right} right · ${values.wrong} wrong` : 'Not played';
                return `
                    <div class="chart-row">
                        <div class="chart-label">${label}</div>
                        <div class="bar" aria-label="${label}: ${count}">
                            <span class="bar-right" style="width:${rightWidth}%"></span>
                            <span class="bar-wrong" style="width:${wrongWidth}%"></span>
                            <span class="bar-count">${count}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[character]);
        }

        function formatDuration(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = Math.round(totalSeconds % 60);
            return minutes ? `${minutes}m ${seconds}s` : `${seconds}s`;
        }

        function showChildResults(batchComplete = false) {
            clearAdvanceTimer();
            if (speakTimeout) clearTimeout(speakTimeout);
            stopQuestionAudio();
            stopFeedbackAudio();

            const todayRecords = recordsForToday();
            const total = todayRecords.length;
            const batchNumber = Math.max(1, Math.ceil(sessionLog.length / BATCH_SIZE));
            const isCompleteBatch = batchComplete && sessionLog.length > 0 && sessionLog.length % BATCH_SIZE === 0;
            const records = isCompleteBatch
                ? sessionLog.filter(record => record.batch === batchNumber)
                : todayRecords;
            const right = records.filter(record => record.correct === true).length;
            const practice = records.filter(record => record.correct !== true).length;
            const todayRight = todayRecords.filter(record => record.correct === true).length;

            document.getElementById('child-kicker').textContent = isCompleteBatch
                ? `Batch ${batchNumber} · ${BATCH_SIZE} questions`
                : `${total} question${total === 1 ? '' : 's'} completed`;
            document.getElementById('child-results-title').textContent = isCompleteBatch
                ? 'Batch complete'
                : 'Today’s progress';
            document.getElementById('child-score').innerHTML = records.length
                ? `<strong>${right}</strong> of ${records.length} right`
                : 'Ready when you are';
            document.getElementById('child-progress').textContent = records.length
                ? `${practice} to practice · ${todayRight} right today`
                : 'Answer a question to start your progress.';
            document.getElementById('continue-playing').textContent = isCompleteBatch ? 'Next 25' : 'Keep playing';

            childContinueShouldAdvance = isCompleteBatch;
            if (isCompleteBatch) pendingBatchReport = false;
            childResults.hidden = false;
            document.getElementById('continue-playing').focus();
        }

        function continuePlaying() {
            childResults.hidden = true;
            if (childContinueShouldAdvance) {
                childContinueShouldAdvance = false;
                move(1);
            } else {
                focusChoice(0);
                speakTimeout = setTimeout(speakQuestion, 250);
            }
        }

        function showResults() {
            clearAdvanceTimer();
            childResults.hidden = true;
            const reportRecords = storedRecords;
            const total = reportRecords.length;
            const reportRight = reportRecords.filter(record => record.correct === true).length;
            const reportWrong = reportRecords.filter(record => record.correct === false).length;
            const reportRevealed = reportRecords.filter(record => record.correct === null).length;
            const reportStats = aggregateStats(reportRecords);
            document.getElementById('results-summary').innerHTML = `
                <div class="result-number total"><strong>${total}</strong>Completed</div>
                <div class="result-number right"><strong>${reportRight}</strong>Right</div>
                <div class="result-number wrong"><strong>${reportWrong}</strong>Wrong</div>
                ${reportRevealed ? `<div class="result-number total"><strong>${reportRevealed}</strong>Revealed</div>` : ''}`;
            document.getElementById('category-chart').innerHTML = chartRows(Object.entries(reportStats.category));
            document.getElementById('difficulty-chart').innerHTML = chartRows(
                Object.entries(reportStats.difficulty).map(([level, values]) => [`Level ${level}`, values])
            );

            const batches = [...new Set(reportRecords.map(record => record.batch))];
            document.getElementById('batch-chart').innerHTML = batches.length
                ? batches.map(batch => {
                    const records = reportRecords.filter(record => record.batch === batch);
                    const right = records.filter(record => record.correct === true).length;
                    const wrong = records.filter(record => record.correct === false).length;
                    const revealed = records.filter(record => record.correct === null).length;
                    const average = records.reduce((sum, record) => sum + record.responseSeconds, 0) / records.length;
                    return `<div class="batch-row"><strong>Batch ${batch}</strong><span>${right} right · ${wrong} wrong${revealed ? ` · ${revealed} revealed` : ''} · ${average.toFixed(1)}s avg</span></div>`;
                }).join('')
                : '<div class="batch-row"><span>No completed questions</span></div>';

            const averageSeconds = total
                ? reportRecords.reduce((sum, record) => sum + record.responseSeconds, 0) / total
                : 0;
            const elapsedSeconds = (Date.now() - sessionStartedAt) / 1000;
            const accuracy = reportRight + reportWrong
                ? Math.round((reportRight / (reportRight + reportWrong)) * 100)
                : 0;
            document.getElementById('session-data').innerHTML = `
                <div class="session-stat"><strong>${accuracy}%</strong>Accuracy</div>
                <div class="session-stat"><strong>${averageSeconds.toFixed(1)}s</strong>Average response</div>
                <div class="session-stat"><strong>${formatDuration(elapsedSeconds)}</strong>Session time</div>
                <div class="session-stat"><strong>${QUESTIONS.length}</strong>Questions in bank</div>`;

            const missed = reportRecords.filter(record => record.correct !== true);
            document.getElementById('review-list').innerHTML = missed.length
                ? missed.map(record => `
                    <div class="review-item">
                        <strong>${escapeHtml(record.question)}</strong>
                        <span class="review-answer">${record.selectedAnswer === null ? 'Answer revealed' : `Chose: ${escapeHtml(record.selectedAnswer)}`} · Answer: ${escapeHtml(record.correctAnswer)} · ${record.category} L${record.difficulty}</span>
                        <span class="review-time">${record.responseSeconds.toFixed(1)}s</span>
                    </div>`).join('')
                : '<div class="review-item"><strong>No questions to review.</strong></div>';

            results.hidden = false;
            const resultsCard = document.getElementById('results-card');
            resultsCard.focus();
            resultsCard.scrollTop = 0;
        }

        function hideResults() {
            results.hidden = true;
            childResults.hidden = false;
            document.getElementById('child-results-card').focus();
        }

        function move(step) {
            clearAdvanceTimer();
            const item = currentItem();
            const record = item ? answers.get(item.id) : null;
            if (step > 0 && pendingBatchReport && record && record.sequence === sessionLog.length) {
                showChildResults(true);
                return;
            }
            if (!deck.length) return;
            if (step > 0 && position === deck.length - 1) {
                showChildResults(false);
                return;
            }
            position = (position + step + deck.length) % deck.length;
            showQuestion();
        }

        startButton.addEventListener('click', startGame);
        category.addEventListener('change', rebuildDeck);
        difficulty.addEventListener('change', rebuildDeck);
        categoryButton.addEventListener('click', () => openPicker('category'));
        difficultyButton.addEventListener('click', () => openPicker('difficulty'));
        document.getElementById('picker-cancel').addEventListener('click', () => closePicker());
        document.getElementById('done').addEventListener('click', () => showChildResults(pendingBatchReport));
        document.getElementById('continue-playing').addEventListener('click', continuePlaying);
        document.getElementById('parent-details').addEventListener('click', showResults);
        document.getElementById('back-to-summary').addEventListener('click', hideResults);
        document.getElementById('previous').addEventListener('click', () => move(-1));
        document.getElementById('hear').addEventListener('click', speakQuestion);
        document.getElementById('next').addEventListener('click', () => move(1));

        function stopQuestionAudio() {
            if (!questionAudio) return;
            questionAudio.pause();
            questionAudio.currentTime = 0;
            questionAudio = null;
        }

        function stopFeedbackAudio() {
            if (!feedbackAudio) return;
            feedbackAudio.pause();
            feedbackAudio.currentTime = 0;
            feedbackAudio = null;
        }

        function speakQuestion() {
            const item = currentItem();
            if (!item) return;
            stopQuestionAudio();
            stopFeedbackAudio();
            questionAudio = new Audio(`audio/${item.id}.mp3?v=2`);
            questionAudio.preload = 'auto';
            questionAudio.play().catch(() => {
                // Some browsers block the first autoplay. The Hear button retries
                // from a user gesture, after which following questions autoplay.
            });
        }

        window.quizReport = () => JSON.parse(JSON.stringify(storedRecords));

        window.quizRemote = {
            left() {
                if (!picker.hidden) { movePicker(-1); return true; }
                if (!childResults.hidden) { moveModal(-1); return true; }
                if (!results.hidden) { scrollResults(-1); return true; }
                if (remoteArea === 'header') { moveHeader(-1); return true; }
                if (remoteArea === 'nav') { moveNav(-1); return true; }
                remoteChoiceStep(-1);
                return true;
            },
            right() {
                if (!picker.hidden) { movePicker(1); return true; }
                if (!childResults.hidden) { moveModal(1); return true; }
                if (!results.hidden) { scrollResults(1); return true; }
                if (remoteArea === 'header') { moveHeader(1); return true; }
                if (remoteArea === 'nav') { moveNav(1); return true; }
                remoteChoiceStep(1);
                return true;
            },
            up() {
                if (!picker.hidden) { movePicker(-1); return true; }
                if (!childResults.hidden) { moveModal(-1); return true; }
                if (!results.hidden) { scrollResults(-1); return true; }
                if (remoteArea === 'nav') { focusChoice(navControls().indexOf(document.activeElement)); return true; }
                if (remoteArea === 'choices') { focusHeader(); return true; }
                return true;
            },
            down() {
                if (!picker.hidden) { movePicker(1); return true; }
                if (!childResults.hidden) { moveModal(1); return true; }
                if (!results.hidden) { scrollResults(1); return true; }
                if (remoteArea === 'header') { focusChoice(remoteHeaderPosition); return true; }
                if (remoteArea === 'choices') { focusNav(remoteChoicePosition); return true; }
                return true;
            },
            select() {
                if (!startScreen.hidden) { startGame(); return true; }
                if (!picker.hidden) {
                    const focused = pickerOptions.querySelector(':focus');
                    if (focused) focused.click();
                    return true;
                }
                if (!results.hidden || !childResults.hidden) {
                    const buttons = !childResults.hidden
                        ? [...childResults.querySelectorAll('button')]
                        : [...results.querySelectorAll('button')];
                    const focused = buttons.includes(document.activeElement)
                        ? document.activeElement
                        : buttons[0];
                    if (focused) focused.click();
                    return true;
                }
                if (remoteArea === 'header') {
                    headerControls()[remoteHeaderPosition].click();
                    return true;
                }
                if (remoteArea === 'nav') {
                    const focused = navControls().find(button => button === document.activeElement);
                    if (focused) focused.click();
                    return true;
                }
                remoteSelect();
                return true;
            },
            back() {
                if (!startScreen.hidden) return false;
                if (!picker.hidden) { closePicker(); return true; }
                if (!results.hidden) { hideResults(); return true; }
                if (!childResults.hidden) { continuePlaying(); return true; }
                return false;
            }
        };

        window.addEventListener('keydown', event => {
            // Some Android TV browsers expose D-pad keys as Android key codes
            // instead of the usual ArrowLeft/ArrowRight values.
            const left = event.key === 'ArrowLeft' || event.keyCode === 37 || event.keyCode === 21;
            const right = event.key === 'ArrowRight' || event.keyCode === 39 || event.keyCode === 22;
            const up = event.key === 'ArrowUp' || event.keyCode === 38 || event.keyCode === 19;
            const down = event.key === 'ArrowDown' || event.keyCode === 40 || event.keyCode === 20;
            const enter = event.key === 'Enter' || event.keyCode === 13 || event.keyCode === 66;
            const space = event.code === 'Space' || event.keyCode === 32 || event.keyCode === 62;

            if (!startScreen.hidden) {
                if (space || enter) {
                    event.preventDefault();
                    startGame();
                }
                return;
            }

            if (!picker.hidden) {
                const pickerButtons = [...picker.querySelectorAll('button')];
                const current = pickerButtons.indexOf(document.activeElement);
                if (event.key === 'Escape' || event.keyCode === 27 || event.keyCode === 4) {
                    event.preventDefault();
                    closePicker();
                } else if (up || left) {
                    event.preventDefault();
                    pickerButtons[(current - 1 + pickerButtons.length) % pickerButtons.length].focus();
                } else if (down || right) {
                    event.preventDefault();
                    pickerButtons[(current + 1) % pickerButtons.length].focus();
                }
                return;
            }

            if (!results.hidden) {
                if (event.key === 'Escape' || event.keyCode === 27 || event.keyCode === 4 || space || enter) {
                    event.preventDefault();
                    hideResults();
                }
                return;
            }

            if (!childResults.hidden) {
                if (event.key === 'Escape' || event.keyCode === 27 || event.keyCode === 4) {
                    event.preventDefault();
                    continuePlaying();
                } else if ((space || enter) && !event.target.matches('button')) {
                    event.preventDefault();
                    continuePlaying();
                }
                return;
            }

            // Let the TV remote operate the category and difficulty menus normally.
            const targetMatches = selector => event.target && typeof event.target.matches === 'function'
                && event.target.matches(selector);
            if (targetMatches('select, input, textarea')) return;

            // Keep native button activation working when a TV remote has focused a button.
            if (targetMatches('button') && enter) return;

            // OK/Enter and Space both reveal the answer on TV remotes.
            if (space || enter) {
                event.preventDefault();
                revealAnswer();
            }
            if (event.code === 'KeyS') { event.preventDefault(); speakQuestion(); }
            if (left) { event.preventDefault(); window.quizRemote.left(); }
            if (right) { event.preventDefault(); window.quizRemote.right(); }
            if (up) { event.preventDefault(); window.quizRemote.up(); }
            if (down) { event.preventDefault(); window.quizRemote.down(); }
        });

        rebuildDeck();
        if (isTv) startButton.focus();
    </script>
</body>
</html>
