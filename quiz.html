<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ</title>
    <style>
        :root {
            --ink: #17233d;
            --navy: #18274b;
            --paper: #fffdf7;
            --cream: #f7ebc9;
            --yellow: #ffd84d;
            --blue: #54c7ec;
            --green: #45b969;
            --red: #e95c55;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 18%, rgba(255,216,77,.45) 0 7%, transparent 7.2%),
                radial-gradient(circle at 91% 84%, rgba(84,199,236,.35) 0 9%, transparent 9.2%),
                var(--cream);
            color: var(--ink);
            font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px clamp(20px, 3vw, 48px);
            background: var(--navy);
            color: white;
            border-bottom: 7px solid var(--yellow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            box-shadow: 0 6px 0 rgba(23,35,61,.12);
            flex-shrink: 0;
        }
        h1 {
            margin: 0;
            font-size: clamp(30px, 3vw, 46px);
            line-height: 1;
            letter-spacing: .08em;
            text-transform: uppercase;
            transform: rotate(-2deg);
        }
        h1::before { content: "★"; color: var(--yellow); margin-right: 12px; }
        .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
        .controls label {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #b8c6e5;
            margin-left: 5px;
        }
        .score {
            display: flex;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
            margin-right: 8px;
        }
        .score .right, .score .wrong {
            padding: 9px 13px;
            border-radius: 999px;
            color: white;
        }
        .score .right { background: var(--green); }
        .score .wrong { background: var(--red); }
        .done-button {
            padding: 10px 18px;
            background: var(--yellow);
            color: var(--ink);
            font-weight: bold;
            box-shadow: 0 4px 0 #b78600;
        }
        .done-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b78600; }
        select, button {
            font: inherit;
            border: 0;
            border-radius: 12px;
            padding: 11px 15px;
            background: white;
            color: var(--ink);
            cursor: pointer;
        }
        select { font-weight: bold; box-shadow: inset 0 0 0 2px #ccd4e5; }
        .filter-button {
            min-width: 112px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            font-weight: bold;
            box-shadow: inset 0 0 0 2px #ccd4e5;
        }
        .filter-button::after { content: "▾"; color: #69748c; }
        select:focus, button:focus {
            outline: 5px solid var(--blue);
            outline-offset: 4px;
        }
        main {
            position: relative;
            width: min(1280px, calc(100% - 48px));
            margin: auto;
            flex-shrink: 0;
            padding: clamp(28px, 4vw, 52px);
            text-align: center;
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 12px 12px 0 var(--ink);
        }
        main:focus { outline: none; }
        .meta {
            position: absolute;
            top: 20px;
            left: 28px;
            color: #7b8499;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .status {
            position: absolute;
            top: 16px;
            right: 26px;
            padding: 8px 16px;
            border-radius: 999px;
            background: var(--yellow);
            color: var(--ink);
            font-size: 18px;
            font-weight: bold;
        }
        .status:empty { display: none; }
        .question {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(36px, 5vw, 76px);
            line-height: 1.08;
            font-weight: bold;
            margin: 0 auto clamp(30px, 5vh, 52px);
            max-width: 950px;
            text-wrap: balance;
        }
        .choices {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 930px;
            margin: 0 auto;
        }
        .choices.two-options {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            max-width: 630px;
        }
        .choice {
            position: relative;
            min-height: 104px;
            padding: 18px 20px;
            font-size: clamp(22px, 2.5vw, 34px);
            font-weight: bold;
            border: 3px solid var(--ink);
            border-radius: 18px;
            background: white;
            box-shadow: 0 7px 0 var(--ink);
            transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
        }
        .choice::before {
            content: attr(data-letter);
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            margin-right: 10px;
            border-radius: 50%;
            background: var(--yellow);
            color: var(--ink);
            font-size: 20px;
            vertical-align: middle;
        }
        .choice.correct::before { content: "✓"; background: var(--green); color: white; }
        .choice.wrong::before { content: "✕"; background: var(--red); color: white; }
        .choice:hover { background: #fff7ce; transform: translateY(-3px); box-shadow: 0 10px 0 var(--ink); }
        .choice:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
        .choice.correct {
            background: #bcebc7;
            border-color: #23783b;
            box-shadow: 0 7px 0 #23783b;
            color: #124b25;
            animation: pop .35s ease-out;
        }
        .choice.wrong {
            background: #ffd4d1;
            border-color: #a93232;
            box-shadow: 0 7px 0 #a93232;
            color: #761f1f;
            animation: shake .3s ease-out;
        }
        .hint {
            margin-top: clamp(34px, 5vh, 52px);
            font-size: clamp(15px, 1.5vw, 19px);
            font-weight: bold;
            letter-spacing: .06em;
            color: #6c7690;
        }
        .nav-buttons { margin-top: 20px; display: flex; justify-content: center; gap: 14px; }
        .nav-buttons button {
            min-width: 150px;
            padding: 12px 22px;
            background: var(--navy);
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 0 #081228;
        }
        .nav-buttons button:active { transform: translateY(4px); box-shadow: 0 1px 0 #081228; }
        .results {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            padding: 28px;
            background: rgba(8, 18, 40, .82);
        }
        .results[hidden] { display: none; }
        .results-card {
            width: min(1000px, 100%);
            max-height: calc(100vh - 56px);
            overflow: auto;
            padding: clamp(28px, 4vw, 52px);
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 12px 12px 0 var(--yellow);
            text-align: center;
        }
        .results-card h2 {
            margin: 0 0 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 5vw, 68px);
        }
        .results-summary {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 24px 0 34px;
        }
        .result-number {
            min-width: 150px;
            padding: 15px 20px;
            border-radius: 18px;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .result-number strong { display: block; font-size: 38px; }
        .result-number.right { background: var(--green); }
        .result-number.wrong { background: var(--red); }
        .result-number.total { background: var(--navy); }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; text-align: left; }
        .chart h3 { margin: 0 0 16px; font-size: 24px; }
        .chart-row {
            display: grid;
            grid-template-columns: 90px 1fr;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }
        .chart-label { font-weight: bold; }
        .bar {
            position: relative;
            display: flex;
            height: 30px;
            overflow: hidden;
            background: #e5e8ef;
            border: 2px solid var(--ink);
            border-radius: 999px;
        }
        .bar-right { background: var(--green); }
        .bar-wrong { background: var(--red); }
        .bar-count {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 1px white;
        }
        .results-actions { margin-top: 34px; }
        .results-actions button {
            padding: 14px 28px;
            background: var(--navy);
            color: white;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 0 #081228;
        }
        .picker {
            position: fixed;
            inset: 0;
            z-index: 120;
            display: grid;
            place-items: center;
            padding: 28px;
            background: rgba(8, 18, 40, .86);
        }
        .picker[hidden] { display: none; }
        .picker-card {
            width: min(720px, 100%);
            padding: clamp(28px, 4vw, 48px);
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 12px 12px 0 var(--yellow);
            text-align: center;
        }
        .picker-card h2 {
            margin: 0 0 28px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 4vw, 52px);
        }
        .picker-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .picker-option {
            min-height: 72px;
            border: 3px solid var(--ink);
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 6px 0 var(--ink);
        }
        .picker-option.selected { background: var(--yellow); }
        .picker-cancel {
            margin-top: 26px;
            background: var(--navy);
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        body.tv-mode { zoom: .88; min-height: 113.64vh; }
        .tv-mode select:focus, .tv-mode button:focus { outline: 7px solid #00e5ff; outline-offset: 6px; }
        .tv-mode header { padding: 22px 38px; }
        .tv-mode .controls { gap: 16px; }
        .tv-mode .filter-button { min-width: 180px; font-size: 22px; padding: 14px 16px; }
        .tv-mode .controls label { font-size: 18px; }
        .tv-mode .score { font-size: 22px; }
        .tv-mode .hint { font-size: 22px; }
        .tv-mode .meta { font-size: 18px; }
        .tv-mode .status { font-size: 22px; }
        .tv-mode .results-card { width: min(1100px, 100%); }
        .tv-mode .chart-label, .tv-mode .bar-count { font-size: 18px; }
        .tv-mode .bar { height: 36px; }
        @keyframes pop { 50% { transform: scale(1.08) rotate(-1deg); } }
        @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @media (max-width: 800px) {
            header { align-items: flex-start; flex-direction: column; }
            .controls {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr);
                justify-content: stretch;
                width: 100%;
            }
            .controls .score { grid-column: 1 / -1; }
            .controls .done-button { grid-column: 1 / -1; width: 100%; }
            .controls label { margin-left: 0; }
            .controls .filter-button { width: 100%; }
            main { width: calc(100% - 28px); padding: 80px 18px 28px; box-shadow: 7px 7px 0 var(--ink); }
            .meta { top: 18px; left: 20px; max-width: calc(100% - 40px); font-size: 12px; }
            .status { top: 42px; right: 18px; padding: 6px 11px; font-size: 14px; }
            .choices, .choices.two-options { grid-template-columns: 1fr; max-width: 930px; }
            .choice { min-height: 70px; }
            .charts { grid-template-columns: 1fr; }
            .results { padding: 14px; }
            .results-card { max-height: calc(100vh - 28px); padding: 28px 18px; }
            .picker-options { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header>
        <h1>QUIZ</h1>
        <div class="controls">
            <div class="score" id="score"><span class="right">✓ Right: 0</span><span class="wrong">✕ Wrong: 0</span></div>
            <button class="done-button" id="done">Done</button>
            <label for="category-button">Category</label>
            <select id="category" hidden>
                <option value="random">Random</option>
                <option value="Math">Math</option>
                <option value="Spelling">Spelling</option>
                <option value="Space">Space</option>
            </select>
            <button class="filter-button" id="category-button" type="button" aria-haspopup="dialog">Random</button>
            <label for="difficulty-button">Difficulty</label>
            <select id="difficulty" hidden>
                <option value="random">Random</option>
                <option value="1">1 - Easy</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5 - Tricky</option>
            </select>
            <button class="filter-button" id="difficulty-button" type="button" aria-haspopup="dialog">Random</button>
        </div>
    </header>

    <main id="game" tabindex="-1">
        <div class="meta" id="meta"></div>
        <div class="status" id="status" aria-live="polite"></div>
        <div class="question" id="question"></div>
        <div class="choices" id="choices"></div>
        <div class="hint">SPACE / OK = SHOW ANSWER · AUTO-NEXT IN 5S · S = HEAR · ← → = MOVE</div>
        <div class="nav-buttons">
            <button id="previous">← Previous</button>
            <button id="next">Next →</button>
        </div>
    </main>

    <div class="results" id="results" role="dialog" aria-modal="true" aria-labelledby="results-title" hidden>
        <section class="results-card" id="results-card" tabindex="-1">
            <h2 id="results-title">Great playing!</h2>
            <div class="results-summary" id="results-summary"></div>
            <div class="charts">
                <div class="chart">
                    <h3>By category</h3>
                    <div id="category-chart"></div>
                </div>
                <div class="chart">
                    <h3>By difficulty</h3>
                    <div id="difficulty-chart"></div>
                </div>
            </div>
            <div class="results-actions">
                <button id="keep-playing">Keep playing</button>
            </div>
        </section>
    </div>

    <div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title" hidden>
        <section class="picker-card">
            <h2 id="picker-title"></h2>
            <div class="picker-options" id="picker-options"></div>
            <button class="picker-cancel" id="picker-cancel" type="button">Cancel</button>
        </section>
    </div>

    <script>
        const userAgent = navigator.userAgent;
        const isTv = /Android TV|GoogleTV|SmartTV|HbbTV|BRAVIA|Tizen|webOS|NetCast|BrowseHere|TCL/i.test(userAgent)
            || (/Android/i.test(userAgent) && !/Mobile/i.test(userAgent));
        if (isTv) document.body.classList.add('tv-mode');

        const QUESTIONS = [
            // Difficulty 1
            {c:'Math',d:1,q:'What is 1 + 2?',a:['2','3','4'],x:1},
            {c:'Math',d:1,q:'Which number is bigger: 3 or 5?',a:['3','5'],x:1},
            {c:'Math',d:1,q:'What comes after 6?',a:['5','7','8'],x:1},
            {c:'Math',d:1,q:'How many sides does a triangle have?',a:['3','4','5'],x:0},
            {c:'Math',d:1,q:'What is 5 − 1?',a:['3','4','5'],x:1},
            {c:'Spelling',d:1,q:'Which word is spelled correctly?',a:['Dog','Dawg','Dok'],x:0},
            {c:'Spelling',d:1,q:'What letter does “ball” start with?',a:['B','D','P'],x:0},
            {c:'Spelling',d:1,q:'Fill in the missing letter: c_t',a:['a','e','i'],x:0},
            {c:'Spelling',d:1,q:'Which word rhymes with “cat”?',a:['Hat','Dog','Sun'],x:0},
            {c:'Spelling',d:1,q:'How do you spell something you wear on your foot?',a:['Shoe','Shoo','Shu'],x:0},
            {c:'Space',d:1,q:'What do we live on?',a:['Earth','Mars','The Moon'],x:0},
            {c:'Space',d:1,q:'What shines during the day?',a:['The Sun','The Moon','A star'],x:0},
            {c:'Space',d:1,q:'Is the Moon a planet?',a:['Yes','No'],x:1},
            {c:'Space',d:1,q:'What color is the sky on a clear day?',a:['Blue','Green','Purple'],x:0},
            {c:'Space',d:1,q:'What do astronauts wear in space?',a:['Spacesuits','Pajamas','Raincoats'],x:0},

            // Difficulty 2
            {c:'Math',d:2,q:'What is 4 + 5?',a:['8','9','10'],x:1},
            {c:'Math',d:2,q:'What is 10 − 3?',a:['6','7','8'],x:1},
            {c:'Math',d:2,q:'What comes next: 2, 4, 6, __?',a:['7','8','9'],x:1},
            {c:'Math',d:2,q:'How many sides does a square have?',a:['3','4','5'],x:1},
            {c:'Math',d:2,q:'Which is smaller?',a:['8','6'],x:1},
            {c:'Spelling',d:2,q:'Which word is spelled correctly?',a:['Fish','Fissh','Fich'],x:0},
            {c:'Spelling',d:2,q:'Fill in the missing letter: d_g',a:['a','o','u'],x:1},
            {c:'Spelling',d:2,q:'Which word rhymes with “sun”?',a:['Run','Sit','Red'],x:0},
            {c:'Spelling',d:2,q:'What is the opposite of “big”?',a:['Tall','Small','Wide'],x:1},
            {c:'Spelling',d:2,q:'How do you spell the color?',a:['Blu','Blue','Bloo'],x:1},
            {c:'Space',d:2,q:'What is the name of our star?',a:['The Sun','Mars','Saturn'],x:0},
            {c:'Space',d:2,q:'Which one is a planet?',a:['Earth','Moon','Sun'],x:0},
            {c:'Space',d:2,q:'What shape does the Moon look like when it is full?',a:['A circle','A square','A triangle'],x:0},
            {c:'Space',d:2,q:'What can you see in the night sky?',a:['Stars','Rainbows only','Clouds only'],x:0},
            {c:'Space',d:2,q:'Do astronauts float in space?',a:['Yes','No'],x:0},

            // Difficulty 3
            {c:'Math',d:3,q:'What is 7 + 6?',a:['12','13','14'],x:1},
            {c:'Math',d:3,q:'What is 14 − 5?',a:['8','9','10'],x:1},
            {c:'Math',d:3,q:'What comes next: 5, 10, 15, __?',a:['18','20','25'],x:1},
            {c:'Math',d:3,q:'You have 2 groups of 3 blocks. How many blocks?',a:['5','6','7'],x:1},
            {c:'Math',d:3,q:'Which number is even?',a:['7','9','12'],x:2},
            {c:'Spelling',d:3,q:'Which word is spelled correctly?',a:['Because','Becaus','Becose'],x:0},
            {c:'Spelling',d:3,q:'Which word means the opposite of “hot”?',a:['Warm','Cold','Fast'],x:1},
            {c:'Spelling',d:3,q:'Which word has two syllables?',a:['Cat','Apple','Dog'],x:1},
            {c:'Spelling',d:3,q:'Which word rhymes with “cake”?',a:['Bike','Make','Book'],x:1},
            {c:'Spelling',d:3,q:'Which word means the opposite of “up”?',a:['Over','Down','Around'],x:1},
            {c:'Space',d:3,q:'Which planet is known for its rings?',a:['Mars','Saturn','Earth'],x:1},
            {c:'Space',d:3,q:'Which planet is closest to the Sun?',a:['Mercury','Earth','Neptune'],x:0},
            {c:'Space',d:3,q:'What is the Moon’s light really?',a:['Reflected sunlight','Fire','A flashlight'],x:0},
            {c:'Space',d:3,q:'What is a rocket used for?',a:['Going into space','Sailing on water','Digging holes'],x:0},
            {c:'Space',d:3,q:'Which is bigger?',a:['Earth','The Sun'],x:1},

            // Difficulty 4
            {c:'Math',d:4,q:'What is 18 + 7?',a:['24','25','26'],x:1},
            {c:'Math',d:4,q:'What is 20 − 9?',a:['10','11','12'],x:1},
            {c:'Math',d:4,q:'What comes next: 3, 6, 9, 12, __?',a:['14','15','16'],x:1},
            {c:'Math',d:4,q:'What is 2 + 2 + 2 + 2?',a:['6','8','10'],x:1},
            {c:'Math',d:4,q:'Sam has 12 cookies and gives away 4. How many are left?',a:['7','8','9'],x:1},
            {c:'Spelling',d:4,q:'Which word is spelled correctly?',a:['Little','Littel','Litil'],x:0},
            {c:'Spelling',d:4,q:'Which word means the same as “quick”?',a:['Fast','Slow','Quiet'],x:0},

            {c:'Spelling',d:4,q:'Which word starts with the same sound as “chair”?',a:['Cheese','Cat','Ship'],x:0},
            {c:'Spelling',d:4,q:'Fill in the missing letter: pl_y',a:['a','e','i'],x:0},
            {c:'Space',d:4,q:'Which planet is called the Red Planet?',a:['Mars','Venus','Jupiter'],x:0},
            {c:'Space',d:4,q:'What causes daytime and nighttime on Earth?',a:['Earth spinning','The Moon moving','Clouds moving'],x:0},
            {c:'Space',d:4,q:'What is the largest planet in our solar system?',a:['Earth','Jupiter','Mars'],x:1},
            {c:'Space',d:4,q:'What do we call a person who travels into space?',a:['Astronaut','Sailor','Explorer'],x:0},
            {c:'Space',d:4,q:'Which object orbits Earth?',a:['The Moon','The Sun','Mars'],x:0},

            // Difficulty 5
            {c:'Math',d:5,q:'What is 15 − 7?',a:['6','8','9'],x:1},
            {c:'Math',d:5,q:'What is 9 + 8?',a:['16','17','18'],x:1},
            {c:'Math',d:5,q:'Mia has 3 bags with 2 apples in each. How many apples?',a:['5','6','8'],x:1},
            {c:'Math',d:5,q:'What comes next: 20, 18, 16, 14, __?',a:['12','13','10'],x:0},
            {c:'Math',d:5,q:'Which number is odd?',a:['12','16','19'],x:2},
            {c:'Spelling',d:5,q:'Which word is spelled correctly?',a:['Friend','Frend','Freind'],x:0},
            {c:'Spelling',d:5,q:'What is the opposite of “early”?',a:['Late','Light','Long'],x:0},
            {c:'Spelling',d:5,q:'Which word has three syllables?',a:['Elephant','Cat','Playground'],x:0},
            {c:'Spelling',d:5,q:'Which word means the same as “tiny”?',a:['Huge','Small','Heavy'],x:1},
            {c:'Spelling',d:5,q:'Which word is spelled correctly?',a:['Beautiful','Beautifull','Beauteful'],x:0},
            {c:'Space',d:5,q:'Why does the Moon appear to shine?',a:['It reflects sunlight','It is on fire','It has light bulbs'],x:0},
            {c:'Space',d:5,q:'Which planet is famous for its big red spot?',a:['Jupiter','Venus','Mercury'],x:0},
            {c:'Space',d:5,q:'What is the path a planet travels around the Sun called?',a:['An orbit','A tunnel','A ladder'],x:0},
            {c:'Space',d:5,q:'Why do astronauts need spacesuits?',a:['To help them breathe and stay safe','To make them fly','To keep rain off'],x:0},
            {c:'Space',d:5,q:'Which planet is farthest from the Sun?',a:['Neptune','Earth','Mars'],x:0}
        ];

        let deck = [];
        let position = -1;
        let answered = false;
        let rightAnswers = 0;
        let wrongAnswers = 0;
        let advanceInterval = null;
        let audioContext = null;
        const answers = new Map();
        const categoryStats = {
            Math: {right: 0, wrong: 0},
            Spelling: {right: 0, wrong: 0},
            Space: {right: 0, wrong: 0}
        };
        const difficultyStats = Object.fromEntries(
            [1, 2, 3, 4, 5].map(level => [level, {right: 0, wrong: 0}])
        );

        const category = document.getElementById('category');
        const difficulty = document.getElementById('difficulty');
        const categoryButton = document.getElementById('category-button');
        const difficultyButton = document.getElementById('difficulty-button');
        const question = document.getElementById('question');
        const choices = document.getElementById('choices');
        const meta = document.getElementById('meta');
        const status = document.getElementById('status');
        const score = document.getElementById('score');
        const results = document.getElementById('results');
        const nextButton = document.getElementById('next');
        const picker = document.getElementById('picker');
        const pickerTitle = document.getElementById('picker-title');
        const pickerOptions = document.getElementById('picker-options');
        let activePicker = null;

        const pickerData = {
            category: {
                title: 'Choose a category',
                select: category,
                trigger: categoryButton,
                options: [['random', 'Random'], ['Math', 'Math'], ['Spelling', 'Spelling'], ['Space', 'Space']]
            },
            difficulty: {
                title: 'Choose a level',
                select: difficulty,
                trigger: difficultyButton,
                options: [['random', 'Random'], ['1', 'Level 1 · Easy'], ['2', 'Level 2'], ['3', 'Level 3'], ['4', 'Level 4'], ['5', 'Level 5 · Tricky']]
            }
        };

        function updateScore() {
            score.innerHTML = `<span class="right">✓ Right: ${rightAnswers}</span><span class="wrong">✕ Wrong: ${wrongAnswers}</span>`;
        }

        function openPicker(type) {
            const data = pickerData[type];
            activePicker = type;
            pickerTitle.textContent = data.title;
            pickerOptions.innerHTML = '';
            data.options.forEach(([value, label]) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'picker-option';
                button.textContent = label;
                if (data.select.value === value) button.classList.add('selected');
                button.addEventListener('click', () => choosePickerValue(value, label));
                pickerOptions.appendChild(button);
            });
            data.trigger.setAttribute('aria-expanded', 'true');
            picker.hidden = false;
            const selected = pickerOptions.querySelector('.selected') || pickerOptions.firstElementChild;
            selected.focus();
        }

        function choosePickerValue(value, label) {
            const data = pickerData[activePicker];
            data.select.value = value;
            data.trigger.textContent = label;
            closePicker(false);
            data.select.dispatchEvent(new Event('change'));
            data.trigger.focus();
        }

        function closePicker(restoreFocus = true) {
            if (!activePicker) return;
            const trigger = pickerData[activePicker].trigger;
            trigger.setAttribute('aria-expanded', 'false');
            picker.hidden = true;
            activePicker = null;
            if (restoreFocus) trigger.focus();
        }

        function shuffle(items) {
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            return items;
        }

        function matchingQuestions() {
            return QUESTIONS.filter(item =>
                (category.value === 'random' || item.c === category.value) &&
                (difficulty.value === 'random' || item.d === Number(difficulty.value))
            );
        }

        function rebuildDeck() {
            deck = shuffle(matchingQuestions().map((_, index) => index));
            position = 0;
            showQuestion();
            if (isTv) document.getElementById('game').focus();
        }

        function currentQuestions() {
            return matchingQuestions();
        }

        function clearAdvanceTimer() {
            if (advanceInterval) clearInterval(advanceInterval);
            advanceInterval = null;
            nextButton.textContent = 'Next →';
        }

        function startAdvanceTimer() {
            clearAdvanceTimer();
            let seconds = 5;
            nextButton.textContent = `Next → ${seconds}`;
            advanceInterval = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearAdvanceTimer();
                    move(1);
                } else {
                    nextButton.textContent = `Next → ${seconds}`;
                }
            }, 1000);
        }

        function paintAnswer(item, selectedIndex) {
            [...choices.children].forEach((button, choiceIndex) => {
                if (choiceIndex === item.x) button.classList.add('correct');
                if (selectedIndex !== null && choiceIndex === selectedIndex && choiceIndex !== item.x) {
                    button.classList.add('wrong');
                }
            });
            status.textContent = selectedIndex === null
                ? `The answer is ${item.a[item.x]}`
                : selectedIndex === item.x
                    ? 'Correct! 🎉'
                    : `Not quite — the answer is ${item.a[item.x]}`;
        }

        function showQuestion() {
            clearAdvanceTimer();
            const list = currentQuestions();
            if (!list.length) return;
            const item = list[deck[position]];
            const savedAnswer = answers.get(item);
            answered = answers.has(item);
            question.textContent = item.q;
            meta.textContent = `${item.c} · Level ${item.d} · ${position + 1}/${list.length}`;
            status.textContent = '';
            choices.innerHTML = '';
            choices.classList.toggle('two-options', item.a.length === 2);
            item.a.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice';
                button.tabIndex = -1;
                button.dataset.letter = String.fromCharCode(65 + index);
                button.textContent = choice;
                button.addEventListener('click', () => chooseAnswer(index));
                choices.appendChild(button);
            });
            if (savedAnswer) paintAnswer(item, savedAnswer.selectedIndex);
        }

        function revealAnswer() {
            if (answered) return;
            answered = true;
            const item = currentQuestions()[deck[position]];
            answers.set(item, {selectedIndex: null});
            paintAnswer(item, null);
            startAdvanceTimer();
        }

        function chooseAnswer(index) {
            if (answered) return;
            answered = true;
            const item = currentQuestions()[deck[position]];
            answers.set(item, {selectedIndex: index});
            if (index === item.x) {
                rightAnswers++;
                categoryStats[item.c].right++;
                difficultyStats[item.d].right++;
            } else {
                wrongAnswers++;
                categoryStats[item.c].wrong++;
                difficultyStats[item.d].wrong++;
            }
            updateScore();
            paintAnswer(item, index);
            playTone(index === item.x);
            startAdvanceTimer();
        }

        function playTone(correct) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            if (!audioContext) audioContext = new AudioContext();
            if (audioContext.state === 'suspended') audioContext.resume();

            const now = audioContext.currentTime + 0.01;
            const notes = correct
                ? [{frequency: 523, start: 0, length: 0.13}, {frequency: 659, start: 0.14, length: 0.2}]
                : [{frequency: 220, start: 0, length: 0.18}, {frequency: 165, start: 0.16, length: 0.28}];

            notes.forEach(note => {
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                const start = now + note.start;
                const end = start + note.length;
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(note.frequency, start);
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(0.12, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, end);
                oscillator.connect(gain);
                gain.connect(audioContext.destination);
                oscillator.start(start);
                oscillator.stop(end + 0.02);
            });
        }

        function chartRows(items) {
            return items.map(([label, values]) => {
                const total = values.right + values.wrong;
                const rightWidth = total ? (values.right / total) * 100 : 0;
                const wrongWidth = total ? (values.wrong / total) * 100 : 0;
                const count = total ? `${values.right} right · ${values.wrong} wrong` : 'Not played';
                return `
                    <div class="chart-row">
                        <div class="chart-label">${label}</div>
                        <div class="bar" aria-label="${label}: ${count}">
                            <span class="bar-right" style="width:${rightWidth}%"></span>
                            <span class="bar-wrong" style="width:${wrongWidth}%"></span>
                            <span class="bar-count">${count}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        function showResults() {
            clearAdvanceTimer();
            const total = rightAnswers + wrongAnswers;
            document.getElementById('results-summary').innerHTML = `
                <div class="result-number total"><strong>${total}</strong>Answered</div>
                <div class="result-number right"><strong>${rightAnswers}</strong>Right</div>
                <div class="result-number wrong"><strong>${wrongAnswers}</strong>Wrong</div>`;
            document.getElementById('category-chart').innerHTML = chartRows(Object.entries(categoryStats));
            document.getElementById('difficulty-chart').innerHTML = chartRows(
                Object.entries(difficultyStats).map(([level, values]) => [`Level ${level}`, values])
            );
            results.hidden = false;
            const resultsCard = document.getElementById('results-card');
            resultsCard.focus();
            resultsCard.scrollTop = 0;
        }

        function hideResults() {
            results.hidden = true;
            document.getElementById('done').focus();
        }

        function move(step) {
            clearAdvanceTimer();
            const list = currentQuestions();
            if (!list.length) return;
            position = (position + step + list.length) % list.length;
            showQuestion();
        }

        category.addEventListener('change', rebuildDeck);
        difficulty.addEventListener('change', rebuildDeck);
        categoryButton.addEventListener('click', () => openPicker('category'));
        difficultyButton.addEventListener('click', () => openPicker('difficulty'));
        document.getElementById('picker-cancel').addEventListener('click', () => closePicker());
        document.getElementById('done').addEventListener('click', showResults);
        document.getElementById('keep-playing').addEventListener('click', hideResults);
        document.getElementById('previous').addEventListener('click', () => move(-1));
        document.getElementById('next').addEventListener('click', () => move(1));
        function speakQuestion() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(question.textContent);
            utterance.rate = 0.8;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        window.addEventListener('keydown', event => {
            // Some Android TV browsers expose D-pad keys as Android key codes
            // instead of the usual ArrowLeft/ArrowRight values.
            const left = event.key === 'ArrowLeft' || event.keyCode === 37 || event.keyCode === 21;
            const right = event.key === 'ArrowRight' || event.keyCode === 39 || event.keyCode === 22;
            const up = event.key === 'ArrowUp' || event.keyCode === 38 || event.keyCode === 19;
            const down = event.key === 'ArrowDown' || event.keyCode === 40 || event.keyCode === 20;
            const enter = event.key === 'Enter' || event.keyCode === 13 || event.keyCode === 66;
            const space = event.code === 'Space' || event.keyCode === 32 || event.keyCode === 62;

            if (!picker.hidden) {
                const pickerButtons = [...picker.querySelectorAll('button')];
                const current = pickerButtons.indexOf(document.activeElement);
                if (event.key === 'Escape' || event.keyCode === 27 || event.keyCode === 4) {
                    event.preventDefault();
                    closePicker();
                } else if (up || left) {
                    event.preventDefault();
                    pickerButtons[(current - 1 + pickerButtons.length) % pickerButtons.length].focus();
                } else if (down || right) {
                    event.preventDefault();
                    pickerButtons[(current + 1) % pickerButtons.length].focus();
                }
                return;
            }

            if (!results.hidden) {
                if (event.key === 'Escape' || event.keyCode === 27 || event.keyCode === 4 || space || enter) {
                    event.preventDefault();
                    hideResults();
                }
                return;
            }

            // Let the TV remote operate the category and difficulty menus normally.
            if (event.target.matches('select, input, textarea')) return;

            // Keep native button activation working when a TV remote has focused a button.
            if (event.target.matches('button') && enter) return;

            // OK/Enter and Space both reveal the answer on TV remotes.
            if (space || enter) {
                event.preventDefault();
                revealAnswer();
            }
            if (event.code === 'KeyS') { event.preventDefault(); speakQuestion(); }
            if (left) { event.preventDefault(); move(-1); }
            if (right) { event.preventDefault(); move(1); }
            if (isTv && up) {
                event.preventDefault();
                categoryButton.focus();
            }
            if (isTv && down) {
                event.preventDefault();
                document.getElementById('next').focus();
            }
        });

        rebuildDeck();
    </script>
</body>
</html>
